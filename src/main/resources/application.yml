server:
  port: 9090
spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      # 재고 행 잠금을 무한정 기다리지 않도록 연결마다 락 대기 상한을 건다
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  data:
    web:
      pageable:
        serialization-mode: via-dto
        max-page-size: 100

logging:
  level:
    com.example.inventory: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
